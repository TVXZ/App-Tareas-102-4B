<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 320px;
        }
        .login-card h2 {
            margin-top: 0;
            color: #1a73e8;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 0.7rem;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #1557b0;
        }
        .error-message {
            background-color: #ffebe9;
            color: #d93025;
            padding: 0.6rem;
            border-radius: 6px;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Iniciar sesión</h2>
    <p style="text-align: center; color: #666; font-size: 0.9rem;">Ingresa tus credenciales para continuar.</p>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="btn-submit">Ingresar</button>
    </form>

    <div id="errorMessage" class="error-message"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');
        
        errorMessage.style.display = 'none';

        try {
            const response = await fetch('/api-token-auth/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            });

            const data = await response.json();

            if (response.ok && data.token) {
                
                localStorage.clear();
                localStorage.setItem('token', data.token);
                window.location.href = '/';
            } else {
                errorMessage.innerText = 'Usuario o contraseña incorrectos.';
                errorMessage.style.display = 'block';
            }
        } catch (error) {
            errorMessage.innerText = 'No se pudo conectar con el servidor. Intenta nuevamente.';
            errorMessage.style.display = 'block';
        }
    });
</script>

</body>
</html>
